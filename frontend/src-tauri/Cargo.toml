[package]
name = "friday"
version = "0.1.0"
description = "Friday — Assistente Multimodal Local"
authors = ["Juan"]
edition = "2021"

[lib]
name = "friday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
